<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#171717">
  <script>
    try {
      const savedTheme = localStorage.getItem('marginalia.chatReader.theme');
      const theme = savedTheme === 'light' || savedTheme === 'dark'
        ? savedTheme
        : matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      document.documentElement.dataset.theme = theme;
      document.querySelector('meta[name="theme-color"]').content = theme === 'light' ? '#faf8f3' : '#171717';
    } catch (_error) {}
  </script>
  <meta name="description" content="Marginalia EPUB 阅读器">
  <title>EPUB 阅读 · Marginalia</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="书库与目录" aria-hidden="false">
      <div class="sidebar-header">
        <a class="brand" href="/book-chat/" aria-label="Marginalia EPUB 阅读首页">
          <span class="brand-mark" aria-hidden="true">M</span>
          <span><strong>Marginalia</strong><small>EPUB 阅读</small></span>
        </a>
        <div class="sidebar-header-actions">
          <button class="icon-button theme-toggle" id="theme-toggle" type="button" aria-label="切换到浅色模式" title="切换到浅色模式">
            <span id="theme-icon" aria-hidden="true">☀</span>
          </button>
          <button class="icon-button mobile-only" id="close-sidebar" type="button" aria-label="关闭侧栏">×</button>
        </div>
      </div>

      <div class="sidebar-tabs" role="tablist" aria-label="阅读导航">
        <button class="sidebar-tab" id="library-tab" type="button" role="tab" aria-selected="true" aria-controls="library-panel" tabindex="0">书库</button>
        <button class="sidebar-tab" id="toc-tab" type="button" role="tab" aria-selected="false" aria-controls="toc-panel" tabindex="-1">目录</button>
      </div>

      <section class="sidebar-panel library-panel" id="library-panel" role="tabpanel" aria-labelledby="library-tab">
        <div class="sidebar-actions">
          <input id="epub-input" type="file" accept=".epub,application/epub+zip" hidden>
          <button class="primary-sidebar-button" id="import-button" type="button">
            <span aria-hidden="true">＋</span><span>导入 EPUB</span>
          </button>
        </div>
        <div class="section-heading">
          <h2>服务器书库</h2>
          <span id="library-count" aria-label="书籍数量">0</span>
        </div>
        <div class="book-list" id="book-list" role="list" aria-live="polite"></div>
        <p class="sidebar-empty" id="library-empty" role="status">正在连接书库…</p>
      </section>

      <section class="sidebar-panel toc-panel" id="toc-panel" role="tabpanel" aria-labelledby="toc-tab" hidden>
        <div class="toc-book-summary" aria-live="polite">
          <strong id="toc-book-title">尚未打开书籍</strong>
          <span id="toc-book-author">选择书库中的 EPUB</span>
        </div>
        <nav class="toc-list" id="toc-list" aria-label="当前书章节目录"></nav>
        <p class="sidebar-empty" id="toc-empty">打开一本书后显示目录。</p>
      </section>

      <a class="back-link" href="/index.html">返回 Marginalia 主界面</a>
    </aside>

    <button class="backdrop" id="backdrop" type="button" aria-label="关闭侧栏" hidden></button>

    <main class="reader-main">
      <header class="topbar">
        <button class="icon-button mobile-only" id="open-sidebar" type="button" aria-label="打开书库与目录" aria-controls="sidebar" aria-expanded="false">☰</button>
        <h1 id="chapter-title" aria-live="polite">尚未打开书籍</h1>
        <span class="progress-label" id="progress-label" aria-label="全书阅读进度">0%</span>
      </header>

      <div class="reader-content">
        <section class="reading-canvas" aria-label="EPUB 正文">
          <div class="reader-stage">
            <div class="epub-container" id="epub-container"></div>
            <div class="reader-state" id="reader-state" role="status" aria-live="polite">
              <div class="state-mark" id="state-mark" aria-hidden="true">M</div>
              <h2 id="state-title">选择一本书开始阅读</h2>
              <p id="state-description">从左侧服务器书库选择 EPUB，或导入一本新书。</p>
              <button class="state-action" id="state-action" type="button">导入 EPUB</button>
            </div>
          </div>
        </section>

        <nav class="page-navigation" id="page-navigation" aria-label="翻页">
          <button class="page-button" id="previous-page" type="button" aria-label="上一页" disabled>上一页</button>
          <span class="page-label" id="page-label" aria-live="polite">第 0 / 0 页</span>
          <button class="page-button" id="next-page" type="button" aria-label="下一页" disabled>下一页</button>
        </nav>

        <footer class="composer-wrap">
          <div class="search-popover" id="search-popover" hidden>
            <div class="search-status" id="search-status" role="status" aria-live="polite"></div>
            <div class="search-results" id="search-results" role="listbox" aria-label="书内搜索结果"></div>
          </div>
          <div class="composer">
            <label class="sr-only" for="search-input">搜索本书</label>
            <input id="search-input" type="search" placeholder="搜索本书" autocomplete="off" aria-autocomplete="list" aria-controls="search-results" aria-expanded="false" disabled>
            <button class="search-jump" id="search-jump" type="button" aria-label="跳转到搜索结果" disabled>⌕</button>
          </div>
        </footer>
      </div>
    </main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <script src="/jszip.min.js"></script>
  <script src="/epub.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
