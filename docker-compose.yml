version: "3.8"

services:
  api:
    build: ./backend
    ports:
      - "8720:8720"
    volumes:
      - ./backend:/app          # Hot reload in dev
      - ./frontend:/frontend:ro # Static PWA served by FastAPI
      - marginalia_data:/app/data
    env_file:
      - .env
    command: uvicorn main:app --host 0.0.0.0 --port 8720 --reload

volumes:
  marginalia_data:
